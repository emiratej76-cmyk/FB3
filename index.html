6387";function render(list){let grid=document.getElementById("productGrid");grid.innerHTML="";if(list.length==0){let q=document.getElementById("searchInput").value;grid.innerHTML=`<div style="grid-column:1/3;text-align:center;padding:30px;background:white;border-radius:12px"><h3>No "${q}" found</h3><p>We can source from Dubai!</p><button style="padding:12px 20px;background:black;color:white;border:none;border-radius:8px" onclick="window.open('https://wa.me/'+MY_WA+'?text=I want '+q+' from Dubai','_blank')">Request ${q} on WhatsApp</button></div>`;return;}list.forEach(p=>{grid.innerHTML+=`<div class="card2" onclick="openProduct(${p.id})"><img src="${p.img}"><div class="info2"><div style="font-size:12px;height:32px;overflow:hidden">${p.name}</div><div style="font-size:11px">⭐ ${p.rating}</div><div><span class="price2">GHS ${p.price}</span><span class="old2">${p.old}</span><button class="addBtn" onclick="event.stopPropagation();addToCart(${p.id})">+</button></div></div></div>`;});}function addToCart(id){let p=PRODUCTS.find(x=>x.id==id);let f=CART.find(x=>x.id==id);if(f)f.qty++;else CART.push({...p,qty:1});localStorage.setItem("fb3cart",JSON.stringify(CART));updateCartCount();}function updateCartCount(){document.getElementById("cartCount").innerText=CART.reduce((a,b)=>a+b.qty,0);document.getElementById("cartNum").innerText=CART.reduce((a,b)=>a+b.qty,0);let total=CART.reduce((a,b)=>a+b.price*b.qty,0);document.getElementById("cartTotal").innerText=total;let itemsDiv=document.getElementById("cartItems");itemsDiv.innerHTML="";CART.forEach(c=>{itemsDiv.innerHTML+=`<div style="display:flex;justify-content:space-between;margin:6px 0"><span>${c.name.substring(0,22)} x${c.qty}</span><span>GHS ${c.price*c.qty} <button onclick="removeCart(${c.id})">x</button></span></div>`;});}function removeCart(id){CART=CART.filter(x=>x.id!=id);localStorage.setItem("fb3cart",JSON.stringify(CART));updateCartCount();}function openProduct(id){let p=PRODUCTS.find(x=>x.id==id);document.getElementById("modalContent").innerHTML=`<img src="${p.img}" style="width:100%;border-radius:8px"><h3>${p.name}</h3><p>⭐ ${p.rating} • Ships from Dubai</p><p><b style="color:red;font-size:22px">GHS ${p.price}</b> <span style="text-decoration:line-through;color:gray">${p.old}</span></p><button style="width:100%;padding:14px;background:#ffcc00;border:none;border-radius:8px;font-weight:900" onclick="addToCart(${p.id});closeModal();showCart()">Add to Cart</button><br><br><button style="width:100%;padding:14px;background:black;color:white;border:none;border-radius:8px;font-weight:900" onclick="buyNow(${p.id})">Buy Now with MoMo</button><br><br><button onclick="closeModal()" style="width:100%;padding:8px">Close</button>`;document.getElementById("productModal").style.display="block";}function closeModal(){document.getElementById("productModal").style.display="none";}function showCart(){updateCartCount();document.getElementById("cartModal").style.display="block";}function closeCart(){document.getElementById("cartModal").style.display="none";}function buyNow(id){let p=PRODUCTS.find(x=>x.id==id);pay(p.price,p.name+" x1");}function checkoutAll(){let total=CART.reduce((a,b)=>a+b.price*b.qty,0);if(total==0){alert("Cart empty");return;}let names=CART.map(c=>c.name.substring(0,15)+" x"+c.qty).join(", ");pay(total,names);}function pay(amount,desc){let email=prompt("Enter email or phone:");if(!email)return;let h=PaystackPop.setup({key:PAYSTACK_KEY,email:email.includes("@")?email:email+"@fb3.com",amount:amount*100,currency:"GHS",ref:"FB3_"+Date.now(),callback:function(res){alert("✅ Paid! Ref: "+res.reference);let msg=`NEW PAID ORDER! Items: ${desc} Amount: GHS ${amount} Ref: ${res.reference} Customer: ${email}`;window.open("https://wa.me/"+MY_WA+"?text="+encodeURIComponent(msg),"_blank");CART=[];localStorage.removeItem("fb3cart");updateCartCount();closeCart();},onClose:function(){}});h.openIframe();}function doSearch(){let q=document.getElementById("searchInput").value.toLowerCase();let filtered=
